<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#DBDBD3" />
    <meta
      name="description"
      content="Repostería artesanal y café hecho con cariño. Descubre Boni Dulcería y haz tu pedido por WhatsApp."
    />
    <link
      rel="icon"
      type="image/png"
      href="/src/LOGOTIPO/PNG/logotipo principal BONI DULCERIA-08.png"
    />
    <title>Boni Dulcería — Un rincón para disfrutar</title>
    <script>
      // Apply the saved or system theme before the first paint to avoid a flash.
      try {
        const savedTheme = localStorage.getItem('boni-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A1D26')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Script para bloquear gestos táctiles de zoom en teléfonos -->
    <script>
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { e.preventDefault(); }
        lastTouchEnd = now;
      }, { passive: false });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
